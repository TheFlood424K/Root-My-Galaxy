name: Quick Build
# Produces a CI APK as fast as possible. Intended for manual
# on-demand builds and pushes to main. Maximises Gradle + SDK caching
# and skips slow SDK Manager verification steps entirely.
#
# The CI variant (applicationId dev.busung.s25uroot.ci) is signed with the
# debug keystore and installs as a separate app, so every build can be
# installed over the previous one without an uninstall.
#
# After a successful build the APK is also attached to a rolling
# "ci-latest" pre-release so AppUpdater can detect and download it
# in-app without requiring a manual uninstall.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: quick-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-build:
    name: Quick Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Export NDK env vars
        run: |
          NDK_PATH=$(ls -d "${ANDROID_SDK_ROOT}/ndk/"*/ 2>/dev/null | sort -V | tail -1)
          NDK_PATH="${NDK_PATH%/}"
          if [[ -z "$NDK_PATH" || ! -d "$NDK_PATH" ]]; then
            echo "ERROR: No pre-installed NDK found under ${ANDROID_SDK_ROOT}/ndk/" >&2
            exit 1
          fi
          echo "Using pre-installed NDK: $NDK_PATH"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> $GITHUB_ENV

      - name: Install missing SDK components
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          NEED=""
          [[ -d "${ANDROID_SDK_ROOT}/platforms/android-37" ]]  || NEED+=" platforms;android-37"
          [[ -d "${ANDROID_SDK_ROOT}/platforms/android-35" ]]  || NEED+=" platforms;android-35"
          [[ -d "${ANDROID_SDK_ROOT}/build-tools/35.0.0" ]]     || NEED+=" build-tools;35.0.0"
          [[ -d "${ANDROID_SDK_ROOT}/cmake/3.22.1" ]]            || NEED+=" cmake;3.22.1"
          if [[ -n "$NEED" ]]; then
            yes | "$SDKMANAGER" $NEED 2>/dev/null || true
          else
            echo "All required SDK components already present, skipping sdkmanager."
          fi

      - name: Cache native build output
        uses: actions/cache@v5
        with:
          path: app/.cxx
          key: native-arm64-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: native-arm64-${{ runner.os }}-

      - name: Build CI APK
        env:
          JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC"
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleCi \
            --build-cache \
            --parallel \
            --no-configuration-cache \
            --no-daemon \
            --console=plain

      - name: Upload CI APK (artifact)
        uses: actions/upload-artifact@v6
        with:
          name: app-ci-${{ github.run_number }}
          path: app/build/outputs/apk/ci/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish rolling ci-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK_PATH="$(ls app/build/outputs/apk/ci/*.apk | head -n 1)"
          # Rename to a stable filename so the in-app updater always finds
          # the same asset name regardless of the build variant suffix.
          DEST="app/build/outputs/apk/ci/root-my-galaxy-ci.apk"
          cp "$APK_PATH" "$DEST"

          # Move the ci-latest tag to HEAD so the release tracks the latest commit.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ci-latest "$SHA"
          git push origin refs/tags/ci-latest --force

          NOTES="CI build #${RUN_NUMBER}\nCommit: ${SHA}"

          if gh release view ci-latest >/dev/null 2>&1; then
            gh release edit ci-latest \
              --title "CI build #${RUN_NUMBER}" \
              --notes "$NOTES" \
              --prerelease
            gh release upload ci-latest "$DEST" --clobber
          else
            gh release create ci-latest "$DEST" \
              --title "CI build #${RUN_NUMBER}" \
              --notes "$NOTES" \
              --prerelease
          fi
